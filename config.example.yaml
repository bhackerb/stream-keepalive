# StreamKeeper Configuration
# Copy to config.yaml and fill in your values

api:
  enabled: true
  port: 8890
  api_key: "YOUR_API_KEY"  # For bearer token auth

discord:
  bot_token: "YOUR_DISCORD_BOT_TOKEN"
  command_channel_id: 1234567890  # Channel ID where bot listens for commands
  notification_channel_id: 1234567890  # Channel for status notifications (can be same)
  command_prefix: "!"

# Browser settings
browser:
  # Regular browsers require the companion extension; managed mode is opt-in.
  control_mode: regular
  engine: "firefox"  # Default; requires: playwright install firefox. Chromium remains opt-in.
  fill_tab: true  # Expand player inside the tab; Escape restores the page
  firefox_user_data_dir: "./browser-data-firefox"  # Separate patched-Firefox profile
  firefox_display_backend: "auto"  # Use x11 on ben-laptop: patched Firefox Wayland crashes on its current KDE protocol
  user_data_dir: "./browser-data"  # Persistent browser profile
  ublock_origin_path: "./extensions/ublock-origin"  # Path to extracted uBlock Origin
  viewport_width: 1920
  viewport_height: 1080
  headless: false  # Set true for server-side monitoring without a display (API/health only)
  # Auto-attachment expects an existing Chromium instance with CDP enabled,
  # for example: chromium --remote-debugging-port=9222
  remote_debugging_url: "http://127.0.0.1:9222"
  # Extra Chromium args
  extra_args:
    - "--autoplay-policy=no-user-gesture-required"
    - "--disable-features=PreloadMediaEngagementData,MediaEngagementBypassAutoplayPolicies"

streams:
  max_streams: 10  # Dock: six widescreen + four vertical

layout:
  borderless: true  # Regular owned stream windows; false restores native decorations.
  backend: "cdp"  # cdp (Chromium/X11), kwin (KDE Wayland, both browsers)
  cdp_scale: 1  # Chromium window coordinates are DIPs: bhbserv's current browser scale is 2
  auto_arrange: false  # Enable after mapping physical displays
  default_display: "tv"
  displays: {}  # Logical names bind to live connected outputs; unknown probes block placement.
  # Optional output connector makes mapping explicit, e.g.:
  # laptop: {output: eDP-1, x: 0, y: 0, width: 1970, height: 1231}
  # Actual connected geometry always replaces these saved coordinates.
  # bhbserv currently reports HDMI-0: 3840x2160 at 0,0.
  # displays:
  #   tv: {x: 0, y: 0, width: 3840, height: 2160}
  #   widescreen: {x: 0, y: 0, width: 3440, height: 1440}
  #   vertical: {x: 3440, y: 0, width: 1080, height: 1920}
  # Replace laptop coordinates with its actual desktop geometry; no guessed defaults.

# Default preferences
defaults:
  site: "streamed.pk"  # Default streaming site
  favorite_teams:
    - "Blues"
    - "Cardinals"

# Health monitoring
health:
  poll_interval_seconds: 5  # How often to check stream health
  stall_threshold_seconds: 15  # How long before a stall triggers recovery
  max_recovery_attempts: 5  # Max recoveries before giving up
  recovery_cooldown_seconds: 30  # Min time between recovery attempts
  screenshot_on_failure: true  # Take screenshot when stream fails

# Ad blocking
ads:
  # Network-level blocking: domains to block
  blocked_domain_patterns:
    - "*googleads*"
    - "*googlesyndication*"
    - "*doubleclick*"
    - "*adservice*"
    - "*adsystem*"
    - "*advertising*"
    - "*adnxs*"
    - "*adsrvr*"
    - "*adform*"
    - "*taboola*"
    - "*outbrain*"
    - "*popads*"
    - "*popcash*"
    - "*propellerads*"
    - "*exoclick*"
    - "*juicyads*"
    - "*trafficjunky*"
    - "*hilltopads*"
    - "*clickadu*"
    - "*pushground*"
    - "*richpush*"
    - "*megapush*"
    - "*ad-maven*"
    - "*admaven*"
    - "*wildcard*offer*"
    - "*wildcasino*"
    - "*wonderblockoffer*"
    - "*bet365*"
    - "*stake.com*"
    - "*1xbet*"
    - "*betway*"
  # Resource types to block entirely
  blocked_resource_types:
    - "beacon"
    # Uncomment below to also block images/fonts for faster loading
    # - "image"
    # - "font"

# Site-specific settings
sites:
  streamed.pk:
    base_url: "https://streamed.pk"
    game_list_path: "/category/ice-hockey"
    # CSS selectors — update these when site changes
    selectors:
      game_card: ".event-card, .match-card, [class*='event'], [class*='match']"
      team_name: ".team-name, .event-name, [class*='team']"
      stream_link: ".stream-link, a[href*='stream'], .source-link"
      video_player: "video, iframe[src*='stream'], iframe[src*='player']"
      ad_overlay: ".overlay, .ad-overlay, [class*='popup'], [class*='modal'], [id*='ad']"
      close_button: ".close, .close-btn, [class*='close'], button[aria-label='Close']"

  onhockey.tv:
    base_url: "https://www.onhockey.tv"
    game_list_path: "/"
    selectors:
      game_card: "tr, .game-row, [class*='game']"
      team_name: "td, .team, [class*='team']"
      stream_link: "a[href*='np_'], a[href*='stream']"
      video_player: "video, iframe"
      ad_overlay: ".overlay, [class*='popup'], [class*='modal']"
      close_button: ".close, [class*='close']"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./logs/stream-keeper.log"
  max_size_mb: 10
  backup_count: 3

# Regular-browser session controls (no special browser profiles).
session:
  max_open_streams: 10  # includes parked windows; defaults to streams.max_streams
  memory_guard: true  # defer new windows when RAM/PSI/browser memory exceeds safe headroom
  start_muted: true
  state_file: regular-session.json
